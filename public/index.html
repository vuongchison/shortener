<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f0f4ff;
            border-radius: 8px;
            display: none;
            border-left: 4px solid #667eea;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .short-url {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .short-url input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 14px;
        }

        .copy-btn {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
            width: auto;
            margin: 0;
        }

        .copy-btn:hover {
            background: #764ba2;
        }

        .copy-btn.copied {
            background: #4caf50;
        }

        .error {
            margin-top: 30px;
            padding: 15px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
            border-left: 4px solid #c62828;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            font-size: 14px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #e0e0e0;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 URL Shortener</h1>
        <p class="subtitle">Create short, shareable links from long URLs</p>

        <form id="shortenForm">
            <form id="shortenForm" autocomplete="off" novalidate>
                <!-- Hidden fields to absorb browser autofill (helps on macOS/Safari) -->
                <input type="text" name="__anti_autofill_username" autocomplete="username" style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; opacity:0;" aria-hidden="true" tabindex="-1">
                <input type="password" name="__anti_autofill_password" autocomplete="new-password" style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; opacity:0;" aria-hidden="true" tabindex="-1">
            <div class="form-group">
                <label for="urlInput">Full URL</label>
                    <input 
                        type="url" 
                        id="urlInput" 
                        name="long_url"
                        placeholder="https://example.com/very/long/url"
                        inputmode="url"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        name="shorten_password"
                        placeholder="Enter password"
                        autocorrect="off"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >
            </div>

            <button type="submit">Shorten Link</button>
            
            <div class="loading" id="loading">
                <span class="spinner"></span>Creating shortened link...
            </div>
        </form>

        <div class="error" id="errorMessage"></div>

        <div class="result" id="result">
            <div class="result-label">Your shortened URL</div>
            <div class="short-url">
                <input 
                    type="text" 
                    id="resultInput" 
                    readonly
                >
                <button type="button" class="copy-btn" id="copyBtn">Copy</button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const passwordInput = document.getElementById('passwordInput');
        const resultDiv = document.getElementById('result');
        const resultInput = document.getElementById('resultInput');
        const errorDiv = document.getElementById('errorMessage');
        const loadingDiv = document.getElementById('loading');
        const copyBtn = document.getElementById('copyBtn');

        // Get API base URL
        function getApiBaseUrl() {
            if (window.location.hostname === 'localhost') {
                return 'http://localhost:5000';
            }
            return window.location.origin;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            const password = passwordInput.value;

            if (!url || !password) {
                showError('Please fill in all fields');
                return;
            }

            await shortenUrl(url, password);
        });

        async function shortenUrl(url, password) {
            // Clear previous messages
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            
            // Show loading
            loadingDiv.classList.add('show');

            try {
                const response = await fetch(`${getApiBaseUrl()}/api/shorten`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: url,
                        password: password
                    })
                });

                loadingDiv.classList.remove('show');

                if (!response.ok) {
                    const data = await response.json();
                    showError(data.error || 'Failed to create shortened URL');
                    return;
                }

                const data = await response.json();
                showResult(data.short_url);
            } catch (error) {
                loadingDiv.classList.remove('show');
                showError('Network error: ' + error.message);
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function showResult(shortUrl) {
            resultInput.value = shortUrl;
            resultDiv.classList.add('show');
            
            // Clear form
            urlInput.value = '';
            passwordInput.value = '';
        }

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            resultInput.select();
            document.execCommand('copy');
            
            const originalText = copyBtn.textContent;
            copyBtn.textContent = '✓ Copied!';
            copyBtn.classList.add('copied');
            
            setTimeout(() => {
                copyBtn.textContent = originalText;
                copyBtn.classList.remove('copied');
            }, 2000);
        });
    </script>
</body>
</html>
